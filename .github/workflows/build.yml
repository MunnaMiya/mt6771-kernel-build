name: Inspect cmdq Makefiles
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git

    - name: Clone Kernel
      run: |
        git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: Inspect cmdq structure
      run: |
        echo "=== cmdq directory tree ==="
        find kernel-source/drivers/misc/mediatek/cmdq -type f -name "Makefile" -o -name "*.h" -o -name "*.c" | sort
        echo ""
        echo "=== Contents of cmdq/v3/Makefile ==="
        cat kernel-source/drivers/misc/mediatek/cmdq/v3/Makefile 2>/dev/null || echo "NOT FOUND"
        echo ""
        echo "=== Contents of cmdq/v3/mt6771/Makefile ==="
        cat kernel-source/drivers/misc/mediatek/cmdq/v3/mt6771/Makefile 2>/dev/null || echo "NOT FOUND"
        echo ""
        echo "=== Does cmdq_engine.h exist? ==="
        find kernel-source/drivers/misc/mediatek/cmdq -name "cmdq_engine.h" -type f
        echo ""
        echo "=== What does cmdq_def.h include? ==="
        cat kernel-source/drivers/misc/mediatek/cmdq/v3/cmdq_def.h
