name: Verify s5k3l6 header after patching

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel (reference)
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Clone Realme kernel (source of sensor)
      run: git clone --depth=1 --branch android-13.0 https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git realme

    - name: Show first 10 lines of realme s5k3l6 header
      run: |
        FILE="realme/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.h"
        echo "=== Realme s5k3l6 header first 10 lines ==="
        head -10 "$FILE"

    - name: Show first 10 lines of realme s5k3l6 C file
      run: |
        FILE="realme/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.c"
        echo "=== Realme s5k3l6 C file first 10 lines ==="
        head -10 "$FILE"

    - name: Check if kd_imgsensor_define.h exists in PDA common/v1_1
      run: |
        if [ -f "nokia-pda/drivers/misc/mediatek/imgsensor/src/common/v1_1/kd_imgsensor_define.h" ]; then
          echo "EXISTS"
        else
          echo "MISSING"
        fi
