name: Inspect both Nokia kernels for imgsensor definitions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone main Nokia MT6771 kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git main-nokia

    - name: Clone Nokia 5.1 Plus kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git pda-nokia

    - name: Find imgsensor_struct definition in main Nokia
      run: |
        cd main-nokia
        echo "=== Main Nokia: imgsensor_struct definition ==="
        grep -rn "} imgsensor_struct;" --include="*.h" drivers/misc/mediatek/imgsensor/
        echo ""
        echo "=== Main Nokia: SENSOR_FEATURE enum near end ==="
        grep -n "SENSOR_FEATURE_" drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h | tail -10

    - name: Find imgsensor_struct definition in PDA Nokia
      run: |
        cd pda-nokia
        echo "=== PDA Nokia: imgsensor_struct definition ==="
        grep -rn "} imgsensor_struct;" --include="*.h" drivers/misc/mediatek/imgsensor/
        echo ""
        echo "=== PDA Nokia: SENSOR_FEATURE enum near end ==="
        grep -n "SENSOR_FEATURE_" drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h | tail -10

    - name: Show the actual struct content around the closing brace in main Nokia
      run: |
        cd main-nokia
        FILE=$(grep -rl "} imgsensor_struct;" --include="*.h" drivers/misc/mediatek/imgsensor/ | head -1)
        if [ -n "$FILE" ]; then
          LINE=$(grep -n "} imgsensor_struct;" "$FILE" | head -1 | cut -d: -f1)
          echo "=== $FILE : lines $((LINE-10)) to $LINE ==="
          sed -n "$((LINE-10)),${LINE}p" "$FILE"
        fi
