name: Inspect mtk_ppm_platform.h
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git

    - name: Clone Kernel
      run: |
        git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: Find mtk_ppm_platform.h and relevant Makefile
      run: |
        echo "=== Locating mtk_ppm_platform.h ==="
        find kernel-source -name "mtk_ppm_platform.h" -type f 2>/dev/null
        echo ""
        echo "=== Makefile that builds mtk_ppm_platform.o ==="
        grep -r "mtk_ppm_platform\.o" kernel-source --include="Makefile" --include="Kbuild"
        echo ""
        echo "=== Existing Makefile in the object's directory ==="
        find kernel-source/drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6771 -name "Makefile" -type f
        find kernel-source/drivers/misc/mediatek/base/power/ppm_v3/src/mach -name "Makefile" -type f
        find kernel-source/drivers/misc/mediatek/base/power/ppm_v3/src -name "Makefile" -type f
