name: Inspect Kernel Source for DVFSRC
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git wget curl bc bison flex \
          build-essential libssl-dev libelf-dev \
          libncurses5-dev python3 python \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          cpio rsync ca-certificates gnupg \
          tree

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Find DVFSRC files and references
      run: |
        cd kernel-source
        
        echo "========================================="
        echo "1. Finding all DVFSRC-related files:"
        echo "========================================="
        find . -type f -iname "*dvfsrc*" 2>/dev/null
        echo ""
        
        echo "========================================="
        echo "2. Finding all files that include helio-dvfsrc.h:"
        echo "========================================="
        grep -r "helio-dvfsrc.h" . --include="*.c" --include="*.h" 2>/dev/null
        echo ""
        
        echo "========================================="
        echo "3. Finding all files that reference dvfsrc:"
        echo "========================================="
        grep -rl "dvfsrc" . --include="*.c" --include="*.h" --include="Makefile" --include="Kconfig" --include="Kbuild" 2>/dev/null
        echo ""
        
        echo "========================================="
        echo "4. Content of helio-dvfsrc.c (the driver itself):"
        echo "========================================="
        find . -name "helio-dvfsrc.c" -type f -exec sh -c 'echo "File: $1"; head -80 "$1"' _ {} \;
        echo ""
        
        echo "========================================="
        echo "5. DVFSRC Kconfig entry:"
        echo "========================================="
        find . -path "*/devfreq/Kconfig" -type f -exec grep -A10 -B2 "DVFSRC" {} \;
        echo ""
        
        echo "========================================="
        echo "6. DVFSRC Makefile entry:"
        echo "========================================="
        find . -path "*/devfreq/Makefile" -type f -exec cat {} \;
        echo ""
        
        echo "========================================="
        echo "7. Search for helio-dvfsrc.h in entire filesystem:"
        echo "========================================="
        find / -name "helio-dvfsrc.h" 2>/dev/null || echo "Not found anywhere"
        echo ""
        
        echo "========================================="
        echo "8. Check include paths used by the driver:"
        echo "========================================="
        find . -name "helio-dvfsrc.c" -type f -exec sh -c 'echo "Includes in $1:"; grep "^#include" "$1"' _ {} \;
        echo ""
        
        echo "========================================="
        echo "9. Look for similar headers in include/linux/soc/mediatek/:"
        echo "========================================="
        find . -path "*/soc/mediatek/*.h" -type f 2>/dev/null
        echo ""
        
        echo "========================================="
        echo "10. Check what config enables this driver:"
        echo "========================================="
        grep -r "CONFIG.*DVFSRC\|CONFIG.*dvfsrc\|CONFIG.*HELIO" . --include="Kconfig" --include="*.h" --include="*.c" 2>/dev/null | head -20
        echo ""
        
        echo "========================================="
        echo "11. Directory structure of drivers/devfreq/:"
        echo "========================================="
        ls -la drivers/devfreq/ 2>/dev/null || echo "Directory not found"
        echo ""
        
        echo "========================================="
        echo "12. Check if helio-dvfsrc.h exists in other MTK kernel repos online:"
        echo "========================================="
        echo "Common locations:"
        echo "  - include/linux/soc/mediatek/helio-dvfsrc.h"
        echo "  - drivers/misc/mediatek/include/mach/helio-dvfsrc.h"
        echo "  - include/linux/helio-dvfsrc.h"

    - name: Upload inspection results
      uses: actions/upload-artifact@v4
      with:
        name: dvfsrc-inspection
        path: |
          kernel-source/drivers/devfreq/
          kernel-source/include/linux/soc/
        retention-days: 7
