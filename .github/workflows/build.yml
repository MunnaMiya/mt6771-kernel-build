name: Inspect eccci modem_sys.h
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git
      - name: Clone kernel
        run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source
      - name: Locate modem_sys.h
        run: find kernel-source -name "modem_sys.h" -type f
      - name: Find which Makefile builds ccci_modem.c
        run: grep -r "ccci_modem\.o" kernel-source --include="Makefile" --include="Kbuild"
      - name: Show the existing include flags in that Makefile
        run: |
          for f in $(grep -rl "ccci_modem\.o" kernel-source --include="Makefile" --include="Kbuild"); do
            echo "=== $f ==="
            cat "$f"
          done
