name: Inspect Nokia 5.1 Plus kernel for missing imgsensor drivers

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia 5.1 Plus kernel source
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda-kernel

    - name: Check sensor directories
      run: |
        cd nokia-pda-kernel
        echo "=== Checking for missing sensors in common/v1_1 ==="
        for sensor in s5k3l6_mipi_raw s5k5e9yx_mipi_raw s5k4h7_mipi_raw; do
          dir="drivers/misc/mediatek/imgsensor/src/common/v1_1/$sensor"
          if [ -d "$dir" ]; then
            echo "FOUND: $sensor"
            echo "  Contents:"
            ls -la "$dir"
          else
            echo "MISSING: $sensor"
          fi
          echo ""
        done

    - name: Check platform (should be MT6771)
      run: |
        cd nokia-pda-kernel
        echo "=== Checking if this is an MT6771 kernel ==="
        grep -r "CONFIG_MACH_MT6771" arch/arm64/configs/ | head -5
