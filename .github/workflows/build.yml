name: Inspect patched imgsensor_sensor.h

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone main Nokia kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: Simulate the fetching and patching steps
      run: |
        cd kernel-source
        # Fetch PDA kernel for the header
        git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda
        # Copy kd_imgsensor_define.h to both places
        cp nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h \
           drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h
        cp nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h \
           drivers/misc/mediatek/imgsensor/src/common/v1_1/kd_imgsensor_define.h
        # Add include line to imgsensor_sensor.h
        sed -i '1i #include "kd_imgsensor_define.h"' \
          drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_sensor.h
        rm -rf nokia-pda

    - name: Show top of modified imgsensor_sensor.h
      run: |
        head -10 kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_sensor.h
