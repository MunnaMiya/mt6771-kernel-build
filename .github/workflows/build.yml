name: Inspect realme-mt6771-devs kernel for imgsensor drivers

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone realme-mt6771-devs kernel (shallow)
      run: |
        git clone --depth=1 --branch android-13.0 \
          https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git \
          realme-mt6771-kernel

    - name: Inspect missing sensor directories
      run: |
        cd realme-mt6771-kernel
        echo "=== Checking s5k3l6_mipi_raw ==="
        ls -la drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/
        echo ""
        echo "=== Checking s5k5e9yx_mipi_raw ==="
        ls -la drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k5e9_mipi_raw/
        echo ""
        echo "=== Checking s5k4h7_mipi_raw ==="
        ls -la drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7_mipi_raw/
