name: Inspect realme imgsensor header definitions (exact lines)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone realme-mt6771-devs kernel
      run: |
        git clone --depth=1 --branch android-13.0 \
          https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git \
          realme-kernel

    - name: Show the enum definition for SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE
      run: |
        cd realme-kernel
        echo "=== Context around the enum value ==="
        grep -n -B5 -A5 "SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE" drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h

    - name: Show the struct definition context (imgsensor_struct)
      run: |
        cd realme-kernel
        echo "=== Context around current_ae_effective_frame in the s5k3l6 header ==="
        grep -n -B5 -A5 "current_ae_effective_frame" drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.h

    - name: Also check the Nokia kernel's kd_imgsensor_define.h for existing enum
      run: |
        echo "=== Checking Nokia kernel (if present) ==="
        if [ -d "nokia-kernel" ]; then
          grep -n "SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE" nokia-kernel/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h || echo "Not found in Nokia"
        fi
