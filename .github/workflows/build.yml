name: Inspect Mali GPU source

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git tree

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Inspect Mali / GPU directory structure
      run: |
        cd kernel-source
        echo "=== GPU directory tree (2 levels deep) ==="
        find drivers/misc/mediatek/gpu -maxdepth 2 -type d 2>/dev/null || echo "No gpu directory"
        echo ""
        echo "=== Mali related files anywhere ==="
        find . -type f -iname "*mali*" 2>/dev/null | head -30
        echo ""
        echo "=== Any Makefile or Kbuild inside gpu ==="
        find drivers/misc/mediatek/gpu -name "Makefile" -o -name "Kbuild" 2>/dev/null
        echo ""
        echo "=== gpu_mali directory contents ==="
        tree -L 4 drivers/misc/mediatek/gpu/gpu_mali 2>/dev/null || echo "gpu_mali not found or empty"
