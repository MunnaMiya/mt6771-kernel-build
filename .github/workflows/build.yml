name: Inspect s5k4h7 header for missing include

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia kernel (post-fix state)
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia

    - name: Show first 10 lines of the header
      run: |
        cd nokia
        FILE="drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7yx_mipi_raw/s5k4h7mipiraw_Sensor.h"
        if [ -f "$FILE" ]; then
          echo "=== First 15 lines of $FILE ==="
          head -15 "$FILE"
        else
          echo "File not found (directory not renamed?)"
          # Also check the original name
          FILE2="drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7_mipi_raw/s5k4h7mipiraw_Sensor.h"
          if [ -f "$FILE2" ]; then
            echo "Found under original name:"
            head -15 "$FILE2"
          fi
        fi
