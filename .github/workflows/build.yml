name: Build MT6771 Kernel OC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git wget curl bc bison flex \
          build-essential libssl-dev libelf-dev \
          libncurses-dev python3 python3-pip \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          cpio rsync ca-certificates gnupg

    - name: Get kernel_config from repo
      env:
        TOKEN: ${{ github.token }}
      run: |
        git clone --depth=1 \
          https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git \
          myrepo
        cp myrepo/kernel_config.txt ./kernel_config.txt
        echo "kernel_config.txt ready"

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Fix Build Issues
      run: |
        cd kernel-source
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) \
          -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true
        grep -rl "implicit-function-declaration" . 2>/dev/null | while read f; do
          sed -i '/implicit-function-declaration/d' "$f"
        done
        sed -i '/^YYLTYPE yylloc;/s/^/extern /' \
          scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
        sed -i 's/(desc && desc->action && desc->action->name) ?/(0) ?/g' \
          kernel/irq/irqdesc.c
        # Auto-include all mediatek subdirs
        python3 -c "
        import os, glob
        for makefile in glob.glob('drivers/misc/mediatek/**/Makefile', recursive=True):
            dir = os.path.dirname(makefile)
            line = f'ccflags-y += -I\$(srctree)/{dir}\n'
            with open(makefile, 'r+') as f:
                content = f.read()
                if line.strip() not in content:
                    f.seek(0, 0)
                    f.write(line + content)
        "
        for d in 'drivers/devfreq' 'drivers/clk/mediatek' 'drivers/misc/mediatek/eccci/mt6771'; do
          sed -i "1i ccflags-y += -I\$(srctree)/$d" $d/Makefile 2>/dev/null || true
        done
        echo "MTK_PLATFORM=mt6771" >> Makefile
        echo "All build fixes applied"

    - name: Patch CPU OPP – Force 1989 MHz @ 1.000V (CPU_LEVEL_0 / V3)
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c"
        with open(path, "r") as f:
            content = f.read()

        # Clean approach: locate the function, find its closing brace, replace body
        func_start = content.find("unsigned int _mt_cpufreq_get_cpu_level(void)")
        if func_start == -1:
            print("ERROR: CPU level function not found")
            exit(1)

        brace_start = content.find("{", func_start)
        if brace_start == -1:
            print("ERROR: Opening brace not found")
            exit(1)

        # count braces to find matching closing brace
        count = 1
        pos = brace_start + 1
        while count > 0 and pos < len(content):
            if content[pos] == '{':
                count += 1
            elif content[pos] == '}':
                count -= 1
            pos += 1
        func_end = pos  # right after the closing brace

        # Build replacement body (keep the function signature and opening brace)
        replacement = (
            content[func_start:brace_start + 1] +
            "\n\t/* OC: Force CPU_LEVEL_0 = 1989 MHz (2.0 GHz) @ 1.000V (V3 bin) */\n"
            "\tunsigned int lv = CPU_LEVEL_0;\n"
            "\tturbo_flag = 0;\n"
            "\ttag_pr_info(\"%d, %d, (%d, %d)\\n\", lv, turbo_flag, UP_SRATE, DOWN_SRATE);\n"
            "\treturn lv;\n"
            "}"
        )
        content = content[:func_start] + replacement + content[func_end:]
        print("CPU patch applied – 1989 MHz @ 1.000V (Tier 2)")
        with open(path, "w") as f:
            f.write(content)

    - name: Patch GPU Segment – Force 900 MHz @ 0.900V (SEGMENT_1)
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c"
        with open(path, "r") as f:
            content = f.read()

        marker = "if (g_efuse_speed_bound_id == 0x03000000)"
        idx = content.find(marker)
        if idx == -1:
            print("ERROR: GPU segment block not found")
            exit(1)

        block_start = content.rfind("if (g_efuse_speed_bound_id", 0, idx)
        if block_start == -1:
            block_start = idx

        brace = 0
        block_end = block_start
        for i in range(block_start, min(block_start + 2000, len(content))):
            if content[i] == '{':
                brace += 1
            elif content[i] == '}':
                brace -= 1
                if brace == 0:
                    block_end = i + 1
                    break

        if block_end == block_start:
            print("ERROR: Could not find end of GPU segment block")
            exit(1)

        replacement = "\t/* OC: Force Segment 1 = 900 MHz GPU @ 0.900V */\n\tg_segment_id = MT6771_SEGMENT_1;\n"
        content = content[:block_start] + replacement + content[block_end:]
        print("GPU patch applied – 900 MHz @ 0.900V (Tier 2)")
        with open(path, "w") as f:
            f.write(content)

    - name: Copy Kernel Config
      run: |
        cp kernel_config.txt \
          kernel-source/arch/arm64/configs/walton_defconfig
        echo "Config copied"

    - name: Configure Kernel
      run: |
        cd kernel-source
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             walton_defconfig

    - name: Build Kernel
      shell: bash
      run: |
        cd kernel-source
        set -o pipefail
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             HOSTCFLAGS="-fcommon" \
             -j$(nproc) Image.gz 2>&1 | tee build.log
        BUILD_RESULT=${PIPESTATUS[0]}
        echo "Exit code: $BUILD_RESULT"
        if [ -f arch/arm64/boot/Image.gz ]; then
          echo "SUCCESS"
          ls -lh arch/arm64/boot/Image.gz
          strings arch/arm64/boot/Image.gz | grep "Linux version" || true
        else
          echo "FAILED"
          grep "error:" build.log | grep -v "warning:" | tail -20
          exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-oc
        path: |
          kernel-source/arch/arm64/boot/Image.gz
          kernel-source/build.log
