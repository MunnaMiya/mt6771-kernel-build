name: Inspect imgsensor common structure

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia MT6771 Kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: Show common directory tree (2 levels)
      run: |
        cd kernel-source
        echo "=== common/ tree (depth 2) ==="
        find drivers/misc/mediatek/imgsensor/src/common -maxdepth 2 -type d 2>/dev/null || echo "no common dir"

    - name: Show mt6771 Makefile
      run: |
        cd kernel-source
        echo "=== mt6771/Makefile ==="
        cat drivers/misc/mediatek/imgsensor/src/mt6771/Makefile
