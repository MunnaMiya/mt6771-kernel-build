name: Inspect Kernel Source for mtk_gpufreq.h
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:18.04

    steps:
    - name: Clone Kernel
      run: |
        git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: Find mtk_gpufreq.h
      run: |
        echo "=== Searching for mtk_gpufreq.h ==="
        find kernel-source -name "mtk_gpufreq.h" -type f 2>/dev/null
        echo ""
        echo "=== Files including mtk_gpufreq.h ==="
        grep -r "mtk_gpufreq.h" kernel-source --include="*.c" --include="*.h"
        echo ""
        echo "=== Check mtk_thermal.h include ==="
        cat kernel-source/drivers/misc/mediatek/include/mt-plat/mt6771/include/mach/mtk_thermal.h | head -40
