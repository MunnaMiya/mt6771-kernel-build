name: Inspect PDA kernel kd_imgsensor_define.h for SENSOR_FUNCTION_STRUCT

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda

    - name: Search for SENSOR_FUNCTION_STRUCT and surrounding lines
      run: |
        cd nokia-pda
        FILE="drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h"
        echo "=== Searching for SENSOR_FUNCTION_STRUCT in $FILE ==="
        grep -n "SENSOR_FUNCTION_STRUCT" "$FILE"
        echo ""
        echo "=== Lines around the definition ==="
        grep -n -A20 "SENSOR_FUNCTION_STRUCT {" "$FILE" | head -40
