name: Inspect realme imgsensor headers for missing definitions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone realme-mt6771-devs kernel
      run: |
        git clone --depth=1 --branch android-13.0 \
          https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git \
          realme-kernel

    - name: Find current_ae_effective_frame definition
      run: |
        cd realme-kernel
        echo "=== current_ae_effective_frame in imgsensor_struct ==="
        grep -n -r "current_ae_effective_frame" --include="*.h" drivers/misc/mediatek/imgsensor/

    - name: Find SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE definition
      run: |
        cd realme-kernel
        echo "=== SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE ==="
        grep -n -r "SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE" --include="*.h" drivers/misc/mediatek/imgsensor/
