name: Inspect missing struct/enum definitions

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia X5 (main) kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia-x5

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Find ccu_sensor_info definition
      run: |
        echo "=== ccu_sensor_info in Nokia X5 ==="
        grep -rn "struct ccu_sensor_info" nokia-x5/ --include="*.h" || echo "NOT FOUND"
        echo ""
        echo "=== ccu_sensor_info in Nokia PDA ==="
        grep -rn "struct ccu_sensor_info" nokia-pda/ --include="*.h" || echo "NOT FOUND"

    - name: Find CAMERA_DUAL_CAMERA_SENSOR_ENUM definition
      run: |
        echo "=== CAMERA_DUAL_CAMERA_SENSOR_ENUM in Nokia X5 ==="
        grep -rn "CAMERA_DUAL_CAMERA_SENSOR_ENUM" nokia-x5/ --include="*.h" || echo "NOT FOUND"
        echo ""
        echo "=== CAMERA_DUAL_CAMERA_SENSOR_ENUM in Nokia PDA ==="
        grep -rn "CAMERA_DUAL_CAMERA_SENSOR_ENUM" nokia-pda/ --include="*.h" || echo "NOT FOUND"

    - name: Show the struct definition context (Nokia PDA)
      run: |
        echo "=== ccu_sensor_info struct definition ==="
        grep -rn -A10 "struct ccu_sensor_info" nokia-pda/ --include="*.h"

    - name: Show the enum definition context (Nokia PDA)
      run: |
        echo "=== CAMERA_DUAL_CAMERA_SENSOR_ENUM enum definition ==="
        grep -rn -B2 -A10 "enum CAMERA_DUAL_CAMERA_SENSOR_ENUM" nokia-pda/ --include="*.h"
