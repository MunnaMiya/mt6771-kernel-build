name: Inspect Realme 3 kernel for Mali r14p0

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Realme 3 kernel source
      run: |
        git clone --depth=1 \
          https://github.com/realme-kernel-opensource/Realme3-kernel-source.git \
          ref-kernel

    - name: Inspect – verify Mali r14p0 directory
      run: |
        cd ref-kernel
        echo "=== Checking if mali-r14p0 exists ==="
        if [ -d "drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/mali-r14p0" ]; then
          echo "FOUND: mali-r14p0 directory"
        else
          echo "NOT FOUND: mali-r14p0"
        fi

        echo ""
        echo "=== Checking MT6771 platform support ==="
        if [ -d "drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/mali-r14p0/drivers/gpu/arm/midgard/platform/mt6771" ]; then
          echo "FOUND: mt6771 platform directory"
        else
          echo "NOT FOUND: mt6771 platform"
        fi

        echo ""
        echo "=== Listing top-level contents of mali-r14p0 ==="
        ls -la drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/mali-r14p0/
