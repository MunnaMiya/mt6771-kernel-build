name: Inspect Nokia PDA kernel for SENSOR_WINSIZE_INFO_STRUCT definition

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda

    - name: Search for the struct definition and usage
      run: |
        cd nokia-pda
        echo "=== Searching for SENSOR_WINSIZE_INFO_STRUCT in headers ==="
        grep -rn "SENSOR_WINSIZE_INFO_STRUCT" --include="*.h" .
        echo ""
        echo "=== Also searching in C files (in case it's defined there) ==="
        grep -rn "SENSOR_WINSIZE_INFO_STRUCT" --include="*.c" . | head -5
