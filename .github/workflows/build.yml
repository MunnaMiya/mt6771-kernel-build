name: Inspect imgsensor frameworks across all sources

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install dependencies
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia X5 (main) kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia-x5

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Clone Realme kernel
      run: git clone --depth=1 --branch android-13.0 https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git realme

    - name: Inspect imgsensor framework headers in common/v1_1
      run: |
        echo "=============================================="
        echo "=== COMMON/V1_1 HEADERS COMPARISON ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          ls -1 $kernel/drivers/misc/mediatek/imgsensor/src/common/v1_1/*.h 2>/dev/null || echo "No headers found"
        done

    - name: Check for SENSOR_FUNCTION_STRUCT definition in each kernel
      run: |
        echo ""
        echo "=============================================="
        echo "=== SENSOR_FUNCTION_STRUCT DEFINITION ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          grep -rn "SENSOR_FUNCTION_STRUCT {" --include="*.h" $kernel/drivers/misc/mediatek/imgsensor/ 2>/dev/null || echo "NOT FOUND"
        done

    - name: Check for MSDK_SCENARIO_ID_ENUM definition in each kernel
      run: |
        echo ""
        echo "=============================================="
        echo "=== MSDK_SCENARIO_ID_ENUM DEFINITION ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          grep -rn "MSDK_SCENARIO_ID_ENUM {" --include="*.h" $kernel/drivers/misc/mediatek/imgsensor/ 2>/dev/null || echo "NOT FOUND"
          echo "Typedef:"
          grep -rn "typedef.*MSDK_SCENARIO_ID_ENUM" --include="*.h" $kernel/drivers/misc/mediatek/imgsensor/ 2>/dev/null || echo "No typedef"
        done

    - name: Check for SENSOR_WINSIZE_INFO_STRUCT in each kernel
      run: |
        echo ""
        echo "=============================================="
        echo "=== SENSOR_WINSIZE_INFO_STRUCT DEFINITION ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          grep -rn "SENSOR_WINSIZE_INFO_STRUCT {" --include="*.h" $kernel/drivers/misc/mediatek/imgsensor/ 2>/dev/null || echo "NOT FOUND"
        done

    - name: Compare kd_imgsensor_define.h file sizes (indicates version differences)
      run: |
        echo ""
        echo "=============================================="
        echo "=== kd_imgsensor_define.h FILE SIZE ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          FILE="$kernel/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h"
          if [ -f "$FILE" ]; then
            SIZE=$(wc -l < "$FILE")
            echo "$kernel: $SIZE lines"
          else
            echo "$kernel: NOT FOUND"
          fi
        done

    - name: List all sensor directories in common/v1_1 for each kernel
      run: |
        echo ""
        echo "=============================================="
        echo "=== SENSOR DIRECTORIES IN COMMON/V1_1 ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          ls -1d $kernel/drivers/misc/mediatek/imgsensor/src/common/v1_1/*/ 2>/dev/null | while read dir; do
            basename "$dir"
          done
        done

    - name: Check which kernel has all three needed sensors (s5k3l6, s5k5e9, s5k4h7)
      run: |
        echo ""
        echo "=============================================="
        echo "=== NEEDED SENSORS AVAILABILITY ==="
        echo "=============================================="
        for sensor in s5k3l6_mipi_raw s5k5e9yx_mipi_raw s5k4h7yx_mipi_raw s5k5e9_mipi_raw s5k4h7_mipi_raw; do
          echo ""
          echo "--- $sensor ---"
          for kernel in nokia-x5 nokia-pda realme; do
            if [ -d "$kernel/drivers/misc/mediatek/imgsensor/src/common/v1_1/$sensor" ]; then
              echo "  FOUND in $kernel"
            else
              echo "  missing in $kernel"
            fi
          done
        done

    - name: Compare imgsensor_sensor.h first 50 lines across kernels
      run: |
        echo ""
        echo "=============================================="
        echo "=== imgsensor_sensor.h FIRST 50 LINES ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda; do
          echo ""
          echo "--- $kernel ---"
          head -50 $kernel/drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_sensor.h 2>/dev/null || echo "File not found"
        done

    - name: Show SENSOR_FEATURE enum tail in each kernel
      run: |
        echo ""
        echo "=============================================="
        echo "=== SENSOR_FEATURE ENUM TAIL (last 15 entries) ==="
        echo "=============================================="
        for kernel in nokia-x5 nokia-pda realme; do
          echo ""
          echo "--- $kernel ---"
          FILE="$kernel/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h"
          if [ -f "$FILE" ]; then
            grep -n "SENSOR_FEATURE_" "$FILE" | tail -15
          else
            echo "File not found"
          fi
        done
