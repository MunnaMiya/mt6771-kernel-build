name: Inspect Nokia Imgsensor Sources
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git

    - name: Clone Nokia X5 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          nokia-x5

    - name: Clone Nokia PDA Kernel
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda

    - name: List and Compare Sensor Directories
      run: |
        echo "============================================================"
        echo "=== Nokia X5 (Base) Sensor Dirs in common/v1_1 ==="
        echo "============================================================"
        ls -1 nokia-x5/drivers/misc/mediatek/imgsensor/src/common/v1_1/ || echo "Not found"
        
        echo ""
        echo "============================================================"
        echo "=== Nokia PDA Sensor Dirs in common/v1_1 ==="
        echo "============================================================"
        ls -1 nokia-pda/drivers/misc/mediatek/imgsensor/src/common/v1_1/ || echo "Not found"

    - name: Find Enabled Sensors in X5 Defconfig
      run: |
        echo "============================================================"
        echo "=== Searching for IMGSENSOR config flags in X5 defconfigs ==="
        echo "============================================================"
        # Find all defconfigs and look for camera sensor flags
        find nokia-x5/arch/arm64/configs/ -name "*defconfig" -exec grep -H "IMGSENSOR\|s5k4h7\|s5k3l6\|s5k5e9" {} \; || echo "No matches found"

    - name: Check File Encodings (To fix Python Crash)
      run: |
        echo "============================================================"
        echo "=== Checking file encodings for potential UTF-8 crashes ==="
        echo "============================================================"
        
        echo "--- PDA s5k4h7 .c file ---"
        S5K4H7_C=$(find nokia-pda/drivers/misc/mediatek/imgsensor/ -name "s5k4h7mipiraw_Sensor.c" | head -n 1)
        file "$S5K4H7_C"
        
        echo "--- PDA s5k4h7 .h file ---"
        S5K4H7_H=$(find nokia-pda/drivers/misc/mediatek/imgsensor/ -name "s5k4h7mipiraw_Sensor.h" | head -n 1)
        file "$S5K4H7_H"

    - name: Inspect PDA Core Headers (Missing Structs)
      run: |
        echo "============================================================"
        echo "=== Searching for ACDK & COMPAT Structs in PDA inc/ ==="
        echo "============================================================"
        grep -rn "ACDK_SENSOR_FEATURECONTROL_STRUCT" nokia-pda/drivers/misc/mediatek/imgsensor/inc/ || echo "NOT FOUND in inc/"
        grep -rn "COMPAT_ACDK_SENSOR_FEATURECONTROL_STRUCT" nokia-pda/drivers/misc/mediatek/imgsensor/inc/ || echo "NOT FOUND in inc/"

        echo ""
        echo "============================================================"
        echo "=== Full ccu_sensor_info struct context in PDA ==="
        echo "============================================================"
        grep -B 2 -A 25 "struct ccu_sensor_info {" nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h || echo "NOT FOUND in PDA define.h"

        echo ""
        echo "============================================================"
        echo "=== Full ccu_sensor_info struct context in X5 ==="
        echo "============================================================"
        grep -B 2 -A 25 "struct ccu_sensor_info {" nokia-x5/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h || echo "NOT FOUND in X5 define.h"

    - name: Locate Core imgsensor Platform Drivers in PDA Repo
      run: |
        echo "============================================================"
        echo "=== Finding kd_imgsensor.c & imgsensor.c in PDA repo ==="
        echo "============================================================"
        find nokia-pda/ -name "kd_imgsensor.c"
        find nokia-pda/ -name "imgsensor.c"
        
        echo ""
        echo "============================================================"
        echo "=== Finding kd_imgsensor.h in PDA repo ==="
        echo "============================================================"
        find nokia-pda/ -name "kd_imgsensor.h"
