name: Find seninf files and missing type

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia X5 kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia-x5

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Find seninf.c and seninf_clk.h locations
      run: |
        echo "=== Nokia X5 ==="
        find nokia-x5/drivers/misc/mediatek/imgsensor -name "seninf.c" -type f
        find nokia-x5/drivers/misc/mediatek/imgsensor -name "seninf_clk.h" -type f
        echo ""
        echo "=== Nokia PDA ==="
        find nokia-pda/drivers/misc/mediatek/imgsensor -name "seninf.c" -type f
        find nokia-pda/drivers/misc/mediatek/imgsensor -name "seninf_clk.h" -type f

    - name: Search for ACDK_SENSOR_MCLK_STRUCT definition
      run: |
        echo "=== ACDK_SENSOR_MCLK_STRUCT in Nokia X5 ==="
        grep -rn "ACDK_SENSOR_MCLK_STRUCT" nokia-x5/drivers/misc/mediatek/imgsensor/ --include="*.h" || echo "NOT FOUND"
        echo ""
        echo "=== ACDK_SENSOR_MCLK_STRUCT in Nokia PDA ==="
        grep -rn "ACDK_SENSOR_MCLK_STRUCT" nokia-pda/drivers/misc/mediatek/imgsensor/ --include="*.h" || echo "NOT FOUND"

    - name: Show seninf_clk.h around line 101 (X5)
      run: |
        FILE=$(find nokia-x5/drivers/misc/mediatek/imgsensor -name "seninf_clk.h" -type f | head -1)
        if [ -n "$FILE" ]; then
          echo "=== $FILE lines 95-105 ==="
          sed -n '95,105p' "$FILE"
        else
          echo "seninf_clk.h not found in X5"
        fi

    - name: Show common/v1_1 seninf.c around line 155 (X5)
      run: |
        FILE=$(find nokia-x5/drivers/misc/mediatek/imgsensor -name "seninf.c" -path "*/common/*" | head -1)
        if [ -n "$FILE" ]; then
          echo "=== $FILE lines 150-160 ==="
          sed -n '150,160p' "$FILE"
        else
          echo "common seninf.c not found in X5"
        fi

    - name: Show common/v1_1 seninf.c around line 155 (PDA)
      run: |
        FILE=$(find nokia-pda/drivers/misc/mediatek/imgsensor -name "seninf.c" -path "*/common/*" | head -1)
        if [ -n "$FILE" ]; then
          echo "=== $FILE lines 150-160 ==="
          sed -n '150,160p' "$FILE"
        else
          echo "common seninf.c not found in PDA"
        fi
