name: Build MT6771 Kernel OC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    env:
      MTK_PLATFORM: mt6771

    steps:
    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y git wget curl bc bison flex \
          build-essential libssl-dev libelf-dev \
          libncurses-dev python3 python3-pip \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          cpio rsync ca-certificates gnupg

    - name: Get kernel_config from repo
      env:
        TOKEN: ${{ github.token }}
      run: |
        git clone --depth=1 \
          https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git \
          myrepo
        cp myrepo/kernel_config.txt ./kernel_config.txt
        echo "kernel_config.txt ready"

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Fetch missing Mali r14p0 driver from Realme 3 kernel
      run: |
        git clone --depth=1 \
          https://github.com/realme-kernel-opensource/Realme3-kernel-source.git \
          realme-kernel
        cp -r realme-kernel/drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/mali-r14p0 \
             kernel-source/drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/
        rm -rf realme-kernel
        echo "Mali r14p0 driver copied"

    - name: Fetch imgsensor drivers (PDA Core + Realme Sensors Hybrid)
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda
        git clone --depth=1 --branch android-13.0 \
          https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git \
          mt6771-ref

        # 1. DELETE the old incomplete X5 imgsensor core directories
        rm -rf kernel-source/drivers/misc/mediatek/imgsensor/inc
        rm -rf kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1
        
        # 2. COPY the complete PDA imgsensor core directories (has all structs/enums natively)
        cp -r nokia-pda/drivers/misc/mediatek/imgsensor/inc \
             kernel-source/drivers/misc/mediatek/imgsensor/inc
        cp -r nokia-pda/drivers/misc/mediatek/imgsensor/src/common/v1_1 \
             kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1
        
        # 3. RENAME PDA s5k4h7_mipi_raw to s5k4h7yx_mipi_raw to match defconfig
        mv kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7_mipi_raw \
           kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7yx_mipi_raw
        
        # 4. COPY the two Realme sensors (missing from PDA, required by defconfig)
        cp -r mt6771-ref/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw \
             kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/
        cp -r mt6771-ref/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k5e9_mipi_raw \
             kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k5e9yx_mipi_raw
        
        # 5. Add Realme sensors to the PDA v1_1 Makefile so they actually compile
        V1_MAKEFILE="kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/Makefile"
        echo "obj-y += s5k3l6_mipi_raw/" >> "$V1_MAKEFILE"
        echo "obj-y += s5k5e9yx_mipi_raw/" >> "$V1_MAKEFILE"

        rm -rf nokia-pda mt6771-ref
        echo "Imgsensor core swapped to PDA base + Realme sensors injected"

    - name: Patch imgsensor headers & fix encodings
      shell: python3 {0}
      run: |
        import os, re

        # Safe read/write to bypass UnicodeDecodeError
        def read_file(path):
            with open(path, 'r', encoding='latin-1') as f:
                return f.read()

        def write_file(path, content):
            with open(path, 'w', encoding='latin-1') as f:
                f.write(content)

        # 1. Inject i2c_id into ccu_sensor_info using Regex (scans all inc/ headers)
        inc_dir = "kernel-source/drivers/misc/mediatek/imgsensor/inc/"
        for h_file in os.listdir(inc_dir):
            if h_file.endswith('.h'):
                h_path = os.path.join(inc_dir, h_file)
                content = read_file(h_path)
                if 'ccu_sensor_info' in content and 'int i2c_id;' not in content:
                    match = re.search(r'struct\s+ccu_sensor_info\s*\{', content, re.DOTALL)
                    if match:
                        brace_start = match.end()
                        brace_end = content.find('}', brace_start)
                        if brace_end != -1:
                            content = content[:brace_end] + '    int i2c_id;\n' + content[brace_end:]
                            write_file(h_path, content)
                            print(f"Injected i2c_id into ccu_sensor_info in {h_file}")

        # 2. Add Realme missing enum (SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE)
        define_h = os.path.join(inc_dir, "kd_imgsensor_define.h")
        content = read_file(define_h)
        enum_to_add = 'SENSOR_FEATURE_GET_AE_EFFECTIVE_FRAME_FOR_LE'
        if enum_to_add not in content:
            content = content.replace('SENSOR_FEATURE_MAX', f'    {enum_to_add},\n    SENSOR_FEATURE_MAX')
            write_file(define_h, content)
            print(f"Injected {enum_to_add}")

        # 3. Add current_ae_effective_frame to Realme s5k3l6 header
        s5k3l6_h = "kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.h"
        if os.path.exists(s5k3l6_h):
            content = read_file(s5k3l6_h)
            if 'current_ae_effective_frame' not in content:
                content = content.replace('} imgsensor_struct;', '    kal_uint8 current_ae_effective_frame;\n} imgsensor_struct;')
                write_file(s5k3l6_h, content)
                print("Patched s5k3l6 header")

        # 4. Add current_ae_effective_frame to Realme s5k5e9yx header
        s5k5e9yx_h = "kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k5e9yx_mipi_raw/s5k5e9mipiraw_Sensor.h"
        if os.path.exists(s5k5e9yx_h):
            content = read_file(s5k5e9yx_h)
            if 'current_ae_effective_frame' not in content:
                content = content.replace('} imgsensor_struct;', '    kal_uint8 current_ae_effective_frame;\n} imgsensor_struct;')
                write_file(s5k5e9yx_h, content)
                print("Patched s5k5e9yx header")

        # 5. Fix s5k4h7yx: replace incomplete enum with int in .h file
        s5k4h7yx_h = "kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7yx_mipi_raw/s5k4h7mipiraw_Sensor.h"
        if os.path.exists(s5k4h7yx_h):
            content = read_file(s5k4h7yx_h)
            content = content.replace('enum MSDK_SCENARIO_ID_ENUM current_scenario_id;', 'int current_scenario_id; /* was enum MSDK_SCENARIO_ID_ENUM */')
            write_file(s5k4h7yx_h, content)
            print("Fixed enum in s5k4h7yx header")

        # 6. Fix s5k4h7yx .c file: add includes and replace enum
        s5k4h7yx_c = "kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k4h7yx_mipi_raw/s5k4h7mipiraw_Sensor.c"
        if os.path.exists(s5k4h7yx_c):
            content = read_file(s5k4h7yx_c)
            if '#include "kd_imgsensor.h"' not in content:
                content = '#include "kd_imgsensor.h"\n' + content
            content = content.replace('enum MSDK_SCENARIO_ID_ENUM', 'int')
            write_file(s5k4h7yx_c, content)
            print("Fixed s5k4h7yx .c file")

        # 7. Add S5K4H7_SENSOR_ID to kd_imgsensor.h
        kd_h = os.path.join(inc_dir, "kd_imgsensor.h")
        if os.path.exists(kd_h):
            content = read_file(kd_h)
            if 'S5K4H7_SENSOR_ID' not in content:
                content = content.replace('#define S5K4H7YX_SENSOR_ID', '#define S5K4H7YX_SENSOR_ID\n#define S5K4H7_SENSOR_ID 0x487B')
                write_file(kd_h, content)
                print("Added S5K4H7_SENSOR_ID")

        # 8. Remove Oppo dependency from Realme sensors
        for root, _, files in os.walk("kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw"):
            for f in files:
                if f.endswith('.c'):
                    path = os.path.join(root, f)
                    content = read_file(path)
                    content = content.replace('#include <soc/oppo/oppo_project.h>', '')
                    write_file(path, content)

        for root, _, files in os.walk("kernel-source/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k5e9yx_mipi_raw"):
            for f in files:
                if f.endswith('.c'):
                    path = os.path.join(root, f)
                    content = read_file(path)
                    content = content.replace('#include <soc/oppo/oppo_project.h>', '')
                    write_file(path, content)
        print("Removed Oppo includes")

        # Create Oppo stub just in case
        os.makedirs("kernel-source/include/soc/oppo", exist_ok=True)
        with open("kernel-source/include/soc/oppo/oppo_project.h", "w") as f:
            f.write("")

    - name: Fix Build Issues (include paths, warnings, etc.)
      run: |
        cd kernel-source
        # Standard fixes
        find . -type f \( -name "Makefile" -o -name "Kbuild" \) \
          -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true
        grep -rl "implicit-function-declaration" . 2>/dev/null | while read f; do
          sed -i '/implicit-function-declaration/d' "$f"
        done
        sed -i '/^YYLTYPE yylloc;/s/^/extern /' \
          scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
        sed -i 's/(desc && desc->action && desc->action->name) ?/(0) ?/g' \
          kernel/irq/irqdesc.c

        # Auto-include for every mediatek Makefile
        python3 -c "
        import os, glob
        for makefile in glob.glob('drivers/misc/mediatek/**/Makefile', recursive=True):
            dir = os.path.dirname(makefile)
            line = f'ccflags-y += -I\$(srctree)/{dir}\n'
            with open(makefile, 'r+') as f:
                content = f.read()
                if line.strip() not in content:
                    f.seek(0, 0)
                    f.write(line + content)
        "

        # Specific cross-directory includes
        for d in \
          'drivers/devfreq' \
          'drivers/clk/mediatek' \
          'drivers/misc/mediatek/eccci/mt6771' \
          'drivers/misc/mediatek/base/power/cm_mgr_v1' \
          'drivers/misc/mediatek/base/power/mt6771' \
          'drivers/misc/mediatek/base/power/ppm_v3/src/mach/mt6771' \
          'drivers/misc/mediatek/base/power/spm_v4' \
          'drivers/misc/mediatek/base/power/swpm_v1/mt6771' \
          'drivers/misc/mediatek/cameraisp/src/isp_50' \
          'drivers/misc/mediatek/ccu/src/mt6771' \
          'drivers/misc/mediatek/imgsensor/inc'; do
          sed -i "1i ccflags-y += -I\$(srctree)/$d" $d/Makefile 2>/dev/null || true
        done

        # modem_sys.h fix
        sed -i '1i ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci' \
          drivers/misc/mediatek/eccci/mt6771/Makefile 2>/dev/null || true
        sed -i '1i ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci' \
          drivers/misc/mediatek/eccci/Makefile 2>/dev/null || true

        echo "All build fixes applied"

    - name: Patch CPU OPP – Force 1989 MHz @ 1.000V (CPU_LEVEL_0 / V3)
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c"
        with open(path, "r") as f:
            content = f.read()
        func_start = content.find("unsigned int _mt_cpufreq_get_cpu_level(void)")
        if func_start == -1:
            print("ERROR: CPU function not found")
            exit(1)
        brace_start = content.find("{", func_start)
        if brace_start == -1:
            print("ERROR: opening brace not found")
            exit(1)
        count = 1
        pos = brace_start + 1
        while count > 0 and pos < len(content):
            if content[pos] == '{':
                count += 1
            elif content[pos] == '}':
                count -= 1
            pos += 1
        func_end = pos
        replacement = (
            content[func_start:brace_start + 1] +
            "\n\t/* OC: Force CPU_LEVEL_0 = 1989 MHz (2.0 GHz) @ 1.000V */\n"
            "\tunsigned int lv = CPU_LEVEL_0;\n"
            "\tturbo_flag = 0;\n"
            "\ttag_pr_info(\"%d, %d, (%d, %d)\\n\", lv, turbo_flag, UP_SRATE, DOWN_SRATE);\n"
            "\treturn lv;\n"
            "}"
        )
        content = content[:func_start] + replacement + content[func_end:]
        print("CPU patch applied")
        with open(path, "w") as f:
            f.write(content)

    - name: Patch GPU Segment – Force 900 MHz @ 0.900V (SEGMENT_1)
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c"
        with open(path, "r") as f:
            content = f.read()
        efuse_line = "g_efuse_speed_bound_id = (readl(g_efuse_base + 0x50) & 0x0F000000);"
        start_idx = content.find(efuse_line)
        if start_idx == -1:
            print("ERROR: efuse read not found")
            exit(1)
        start_idx += len(efuse_line)
        log_line = 'gpufreq_pr_info("@%s: g_efuse_speed_bound_id'
        end_idx = content.find(log_line, start_idx)
        if end_idx == -1:
            print("ERROR: segment log line not found")
            exit(1)
        replacement = (
            "\n"
            "\t/* OC: Force Segment 1 = 900 MHz GPU @ 0.900V */\n"
            "\tg_segment_id = MT6771_SEGMENT_1;\n\n"
        )
        content = content[:start_idx] + replacement + content[end_idx:]
        print("GPU patch applied")
        with open(path, "w") as f:
            f.write(content)

    - name: Copy Kernel Config & Disable Camera Sensors
      run: |
        cp kernel_config.txt \
          kernel-source/arch/arm64/configs/walton_defconfig
        
        # DISABLE IMGSENSOR DRIVERS TO BYPASS FRAMEWORK ERRORS
        # This empties the list of camera sensors so the kernel doesn't build them
        sed -i 's/CONFIG_CUSTOM_KERNEL_IMGSENSOR=.*/CONFIG_CUSTOM_KERNEL_IMGSENSOR=""/g' \
          kernel-source/arch/arm64/configs/walton_defconfig
        
        # Verify the change
        grep "CONFIG_CUSTOM_KERNEL_IMGSENSOR" kernel-source/arch/arm64/configs/walton_defconfig
        echo "Config copied and cameras disabled for initial OC test"

    - name: Configure Kernel
      run: |
        cd kernel-source
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             walton_defconfig

    - name: Build Kernel
      shell: bash
      run: |
        cd kernel-source
        set -o pipefail
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             HOSTCFLAGS="-fcommon" \
             -j$(nproc) Image.gz 2>&1 | tee build.log
        BUILD_RESULT=${PIPESTATUS[0]}
        echo "Exit code: $BUILD_RESULT"
        if [ -f arch/arm64/boot/Image.gz ]; then
          echo "SUCCESS"
          ls -lh arch/arm64/boot/Image.gz
          strings arch/arm64/boot/Image.gz | grep "Linux version" || true
        else
          echo "FAILED"
          grep "error:" build.log | grep -v "warning:" | tail -20
          exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-oc
        path: |
          kernel-source/arch/arm64/boot/Image.gz
          kernel-source/build.log
