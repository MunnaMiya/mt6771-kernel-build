name: Inspect other MT6771 kernel for Mali r14p0

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone a reference MT6771 kernel (Realme 3 / RMX1821)
      run: |
        git clone --depth=1 \
          https://github.com/realme-kernel-opensource/realme3_MT6771_kernel_source.git \
          ref-kernel
        echo "Reference kernel cloned"

    - name: Inspect – find Mali r14p0
      run: |
        cd ref-kernel
        echo "=== Searching for mali-r14p0 ==="
        find . -type d -name "mali-r14p0" 2>/dev/null
        echo ""
        echo "=== Mali bifrost directory structure ==="
        find . -path "*/gpu_mali/mali_bifrost" -maxdepth 3 -type d 2>/dev/null || echo "not found"
        echo ""
        echo "=== Any Mali bifrost directories ==="
        find . -type d -name "mali_bifrost" 2>/dev/null
