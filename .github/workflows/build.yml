name: Inspect PDA seninf files after copy

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Show PDA seninf_clk.h lines 95-110
      run: |
        FILE="nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf_clk.h"
        echo "=== PDA seninf_clk.h lines 95-110 ==="
        sed -n '95,110p' "$FILE"

    - name: Show PDA seninf.c lines 145-165 (the pseninf issue)
      run: |
        FILE="nokia-pda/drivers/misc/mediatek/imgsensor/src/common/v1_1/seninf.c"
        echo "=== PDA common/v1_1/seninf.c lines 145-165 ==="
        sed -n '145,165p' "$FILE"

    - name: Check PDA kd_imgsensor_define.h for missing types
      run: |
        echo "=== ACDK_SENSOR_MCLK_STRUCT definition ==="
        grep -n "ACDK_SENSOR_MCLK_STRUCT" nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h
        echo ""
        echo "=== SET_PD_BLOCK_INFO_T definition ==="
        grep -n "SET_PD_BLOCK_INFO_T" nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h || echo "NOT FOUND"
