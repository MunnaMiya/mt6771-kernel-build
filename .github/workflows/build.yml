name: Inspect S5K sensor ID block in main kernel

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone main Nokia kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git main-kernel

    - name: Show S5K definitions around line 210
      run: |
        cd main-kernel
        FILE="drivers/misc/mediatek/imgsensor/inc/kd_imgsensor.h"
        echo "=== Lines 200-230 ==="
        sed -n '200,230p' "$FILE"
