name: Inspect imgsensor availability

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia MT6771 Kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git kernel-source

    - name: List available sensor directories
      run: |
        cd kernel-source
        echo "=== Available sensor directories ==="
        find drivers/misc/mediatek/imgsensor -maxdepth 2 -type d 2>/dev/null
        echo ""
        echo "=== Missing sensors from config ==="
        echo "Config expects: s5k3l6_mipi_raw s5k5e9yx_mipi_raw s5k4h7yx_mipi_raw"
        echo "Checking if they exist..."
        for s in s5k3l6_mipi_raw s5k5e9yx_mipi_raw s5k4h7yx_mipi_raw; do
          found=$(find drivers/misc/mediatek/imgsensor -type d -name "$s" 2>/dev/null)
          if [ -n "$found" ]; then
            echo "  FOUND: $s"
          else
            echo "  MISSING: $s"
          fi
        done
