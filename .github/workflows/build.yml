name: Build MT6771 Kernel OC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl bc \
          libssl-dev libelf-dev bison flex \
          build-essential libncurses-dev python3 zip unzip \
          liblz4-tool lz4
        
        # Manually install legacy libncurses5 and libtinfo5 for older Clang support on ubuntu-latest
        echo "Installing legacy ncurses libraries..."
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

    - name: Download Clang 6 & GCC 4.9 Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # Download AOSP Clang 6.0.2
        echo "Downloading AOSP Clang 6.0..."
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-8.1.0_r0.15/clang-4691093.tar.gz
        mkdir clang && tar -xf clang-4691093.tar.gz -C clang
        
        # Download Stable GCC 4.9 from LineageOS (prevents 128/404 errors)
        echo "Downloading GCC Aarch64 4.9..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 gcc64
        echo "Downloading GCC ARM 4.9..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b lineage-19.1 gcc32

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Fix Build Issues
      run: |
        sed -i 's/ -Werror//g' kernel-source/Makefile
        sed -i 's/ -Werror//g' kernel-source/arch/arm64/Makefile
        sed -i '/^YYLTYPE yylloc;/s/^/extern /' \
          kernel-source/scripts/dtc/dtc-lexer.lex.c_shipped
        
        # Host compiler inline delay fix for older kernels on newer GCC hosts
        sed -i 's/inline void __delay/static inline void __delay/g' kernel-source/arch/arm64/include/asm/delay.h || true
        echo "Build fixes applied"

    - name: Patch CPU OPP
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c"
        with open(path, "r") as f:
            content = f.read()
        old = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n\tunsigned int lv = CPU_LEVEL_0;\n\tunsigned int temp = 0;\n\tunsigned int segcode = 0;\n\tunsigned int bincode = 0;\n\tunsigned int turbocode = 0;\n\tunsigned int a_code = 0;"
        new = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n\tturbo_flag = 0;\n\treturn CPU_LEVEL_0;\n\tunsigned int lv = CPU_LEVEL_0;\n\tunsigned int temp = 0;\n\tunsigned int segcode = 0;\n\tunsigned int bincode = 0;\n\tunsigned int turbocode = 0;\n\tunsigned int a_code = 0;"
        if old in content:
            content = content.replace(old, new)
            print("CPU patch applied OK")
        else:
            print("CPU patch string NOT found")
        with open(path, "w") as f:
            f.write(content)

    - name: Patch GPU Segment
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c"
        with open(path, "r") as f:
            content = f.read()
        old = "\tif (g_efuse_speed_bound_id == 0x03000000) {\n\t\t/* 900MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_1;\n\t} else if (g_efuse_speed_bound_id == 0x05000000) {\n\t\t/* 800MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_2;\n\t} else if (g_efuse_speed_bound_id == 0x07000000) {\n\t\t/* 700MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_3;\n\t} else if (g_efuse_speed_bound_id == 0x02000000 && g_efuse_turbo_id == 0x00000008) {\n\t\t/* 900MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_4;\n\t} else {\n\t\t/* Other Version, set default segment */\n\t\tg_segment_id = MT6771_SEGMENT_2;\n\t}"
        new = "\t/* OC patch: force Segment 1 = 900MHz GPU */\n\tg_segment_id = MT6771_SEGMENT_1;"
        if old in content:
            content = content.replace(old, new)
            print("GPU patch applied OK")
        else:
            print("GPU patch string NOT found")
        with open(path, "w") as f:
            f.write(content)

    - name: Copy Kernel Config
      run: |
        cp kernel_config.txt \
          kernel-source/arch/arm64/configs/walton_defconfig

    - name: Configure Kernel
      run: |
        cd kernel-source
        export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-android- \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             walton_defconfig

    - name: Build Kernel
      run: |
        cd kernel-source
        export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-android- \
             CROSS_COMPILE_ARM32=arm-linux-androideabi- \
             CC=clang \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             HOSTCFLAGS="-fcommon" \
             KCFLAGS="-Wno-error -fno-integrated-as" \
             -j$(nproc) Image.gz 2>&1 | tee build.log
        BUILD_RESULT=${PIPESTATUS[0]}
        echo "Exit code: $BUILD_RESULT"
        if [ -f arch/arm64/boot/Image.gz ]; then
          echo "SUCCESS"
          ls -lh arch/arm64/boot/Image.gz
        else
          echo "FAILED"
          grep "error:" build.log | grep -v "warning:" | tail -30
          exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: kernel-oc
        path: |
          kernel-source/arch/arm64/boot/Image.gz
          kernel-source/build.log
