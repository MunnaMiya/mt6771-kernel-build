name: Inspect main Nokia kd_imgsensor.h for S5K4H7_SENSOR_ID

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone main Nokia kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git main-kernel

    - name: Check if S5K4H7_SENSOR_ID exists and show surrounding lines
      run: |
        cd main-kernel
        FILE="drivers/misc/mediatek/imgsensor/inc/kd_imgsensor.h"
        if [ -f "$FILE" ]; then
          echo "=== Searching for S5K4H7_SENSOR_ID ==="
          grep -n "S5K4H7_SENSOR_ID" "$FILE" || echo "NOT FOUND"
          echo ""
          echo "=== Last 20 lines of the file ==="
          tail -20 "$FILE"
        else
          echo "ERROR: $FILE not found"
        fi
