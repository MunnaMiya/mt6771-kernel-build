name: Inspect Kernel Source – find modem_sys.h

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Inspect – find modem_sys.h
      run: |
        cd kernel-source
        echo "=== Searching for modem_sys.h ==="
        find . -name "modem_sys.h" -type f
        echo ""
        echo "=== If not found, searching for similar files ==="
        find . -name "*modem*" -type f | head -20
