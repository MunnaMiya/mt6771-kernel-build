name: Build MT6771 Kernel OC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget curl bc \
          libssl-dev libelf-dev bison flex \
          build-essential python3 zip unzip liblz4-tool lz4

        # Ubuntu 24.04 (latest) এ ওল্ড Clang 6 রান করার জন্য ম্যানুয়াল লাইব্রেরি ইন্সটলেশন
        echo "Installing legacy ncurses libraries manually..."
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
        sudo dpkg -i libtinfo5_6.3-2_amd64.deb libncurses5_6.3-2_amd64.deb

    - name: Download Clang 6.0 & GCC 4.9 Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        
        # AOSP Clang 6.0.2 (স্টক কার্নেল ভার্সন)
        echo "Downloading AOSP Clang 6.0..."
        wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-8.1.0_r0.15/clang-4691093.tar.gz
        mkdir clang && tar -xf clang-4691093.tar.gz -C clang
        
        # LineageOS GCC 4.9 (Error 128 বা 404 এড়ানোর জন্য সবচেয়ে সেফ এবং ফাস্ট গিট সোর্স)
        echo "Downloading GCC Aarch64 4.9..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b lineage-19.1 gcc64
        echo "Downloading GCC ARM 4.9..."
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git -b lineage-19.1 gcc32

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Fix Build Issues & DTC
      run: |
        cd kernel-source
        sed -i 's/ -Werror//g' Makefile
        sed -i 's/ -Werror//g' arch/arm64/Makefile
        
        # ল্যাটেস্ট উবুন্টু হোস্ট কম্পাইলার (GCC 13) এর জন্য কার্নেলের ভেতরের ডুপ্লিকেট ভ্যারিয়েবল ফিক্স
        sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped
        sed -i 's/inline void __delay/static inline void __delay/g' arch/arm64/include/asm/delay.h || true
        echo "Build fixes applied for latest host environment"

    - name: Patch CPU OPP
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c"
        try:
            with open(path, "r") as f:
                content = f.read()
            
            old = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{"
            new = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n\tturbo_flag = 0;\n\treturn CPU_LEVEL_0;"
            
            if old in content:
                content = content.replace(old, new)
                with open(path, "w") as f:
                    f.write(content)
                print("CPU patch applied OK")
            else:
                print("CPU patch target NOT found! Skipping.")
        except FileNotFoundError:
            print(f"Error: File not found at {path}")

    - name: Patch GPU Segment
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c"
        try:
            with open(path, "r") as f:
                content = f.read()
            
            if "g_efuse_speed_bound_id" in content:
                content = content.replace("g_segment_id = MT6771_SEGMENT_2;", "g_segment_id = MT6771_SEGMENT_1;")
                content = content.replace("g_segment_id = MT6771_SEGMENT_3;", "g_segment_id = MT6771_SEGMENT_1;")
                content = content.replace("g_segment_id = MT6771_SEGMENT_4;", "g_segment_id = MT6771_SEGMENT_1;")
                with open(path, "w") as f:
                    f.write(content)
                print("GPU Overclock patch forced to Segment 1")
            else:
                print("GPU patch target NOT found! Skipping.")
        except FileNotFoundError:
            print(f"Error: File not found at {path}")

    - name: Copy Kernel Config
      run: |
        if [ -f kernel_config.txt ]; then
          cp kernel_config.txt kernel-source/arch/arm64/configs/walton_defconfig
        else
          cp kernel-source/arch/arm64/configs/mt6771_defconfig kernel-source/arch/arm64/configs/walton_defconfig
        fi

    - name: Build Kernel
      run: |
        cd kernel-source
        
        # এনভায়রনমেন্ট এবং পাথ সেটআপ
        export PATH=$GITHUB_WORKSPACE/toolchains/clang/bin:$GITHUB_WORKSPACE/toolchains/gcc64/bin:$GITHUB_WORKSPACE/toolchains/gcc32/bin:$PATH
        export ARCH=arm64
        export SUBARCH=arm64
        
        # কনফিগ জেনারেট করা
        make O=out walton_defconfig
        
        # মেইন কমপিলিং রান (ল্যাটেস্ট হোস্টে ওল্ড সোর্স বিল্ডের জন্য HOSTCFLAGS ফ্ল্যাগস)
        make -j$(nproc) O=out \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          HOSTCFLAGS="-fcommon" \
          KCFLAGS="-fcommon -Wno-error" 2>&1 | tee build.log
          
        BUILD_RESULT=${PIPESTATUS[0]}
        echo "Exit code: $BUILD_RESULT"
        
        if [ -f out/arch/arm64/boot/Image.gz ]; then
          echo "SUCCESS"
          cp out/arch/arm64/boot/Image.gz ./Image.gz-target
        else
          echo "FAILED"
          grep "error:" build.log | tail -n 50
          exit 1
        fi

    - name: Upload Kernel Output
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Walton-RX7-Mini-OC-Kernel
        path: |
          kernel-source/Image.gz-target
          kernel-source/build.log
