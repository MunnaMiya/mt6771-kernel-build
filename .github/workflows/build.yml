name: Inspect S5K4H7_SENSOR_ID definition

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda

    - name: Find where S5K4H7_SENSOR_ID is defined
      run: |
        cd nokia-pda
        echo "=== Searching for S5K4H7_SENSOR_ID in the whole tree ==="
        grep -rn "S5K4H7_SENSOR_ID" --include="*.h" --include="*.c" .

    - name: Also look in the common sensor ID header (if any)
      run: |
        cd nokia-pda
        echo "=== Checking kd_imgsensor.h for sensor IDs ==="
        grep -n "SENSOR_ID" drivers/misc/mediatek/imgsensor/inc/kd_imgsensor.h 2>/dev/null || echo "File not found"
