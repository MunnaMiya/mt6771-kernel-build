name: Build MT6771 Kernel OC
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git wget curl bc \
          libssl-dev libelf-dev bison flex \
          gcc-aarch64-linux-gnu \
          binutils-aarch64-linux-gnu \
          build-essential libncurses-dev python3 \
          libtinfo5 libncurses5

    - name: Download Google Clang 6.0.2
      run: |
        # Download Google's prebuilt clang 6.0.2 (r316199, same as original kernel)
        mkdir -p ~/clang-6
        cd ~/clang-6
        
        # Try multiple sources for clang 6.0.2
        wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-9.0.0_r3/clang-4691093.tar.gz" \
          -O clang6.tar.gz || \
        wget -q "https://github.com/nickelio/clang-6.0.2/releases/download/v1/clang-6.0.2-aarch64-linux.tar.gz" \
          -O clang6.tar.gz || \
        wget -q "https://github.com/kdrag0n/proton-clang/raw/master/bin/clang-6.0.tar.gz" \
          -O clang6.tar.gz
        
        if [ -f clang6.tar.gz ]; then
          tar -xzf clang6.tar.gz
          # Find and symlink clang binary
          find . -name "clang" -type f -executable 2>/dev/null | head -1 | xargs dirname > clang_path.txt
          echo "Clang 6 extracted successfully"
        else
          echo "WARNING: Could not download clang-6, falling back to system clang"
          mkdir -p bin
          ln -sf /usr/bin/clang-15 bin/clang
          ln -sf /usr/bin/clang++-15 bin/clang++
        fi

    - name: Setup Clang 6 Environment
      run: |
        CLANG_DIR=$(cat ~/clang-6/clang_path.txt 2>/dev/null || echo "/usr/bin")
        echo "CLANG_PATH=${CLANG_DIR}" >> $GITHUB_ENV
        echo "Using clang from: ${CLANG_DIR}"
        # Verify clang version
        ${CLANG_DIR}/clang --version || true
        
        # Add to PATH
        echo "${CLANG_DIR}" >> $GITHUB_PATH

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Fix Build Issues
      run: |
        cd kernel-source
        
        # Remove -Werror globally
        find . -name "Makefile" -type f -exec sed -i 's/ -Werror//g' {} +
        find . -name "Kbuild" -type f -exec sed -i 's/ -Werror//g' {} +
        
        # Fix dtc lexer issue
        if [ -f scripts/dtc/dtc-lexer.lex.c_shipped ]; then
          sed -i '/^YYLTYPE yylloc;/s/^/extern /' scripts/dtc/dtc-lexer.lex.c_shipped
        fi
        
        # Fix modern compiler issues with 4.4 kernel
        # Disable integrated assembler for inline assembly compatibility
        export KCFLAGS="-Wno-error -Wno-implicit-fallthrough -fno-integrated-as"
        
        # Fix potential -fcommon issue with GCC 10+
        sed -i 's/-fno-common/-fcommon/g' Makefile 2>/dev/null || true
        
        echo "Build fixes applied"

    - name: Patch CPU OPP - Force 2.0GHz
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c"
        
        with open(path, "r") as f:
            content = f.read()
        
        # Patch 1: Always return CPU_LEVEL_0 (highest bin)
        old1 = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n\tunsigned int lv = CPU_LEVEL_0;\n\tunsigned int temp = 0;\n\tunsigned int segcode = 0;\n\tunsigned int bincode = 0;\n\tunsigned int turbocode = 0;\n\tunsigned int a_code = 0;"
        new1 = "unsigned int _mt_cpufreq_get_cpu_level(void)\n{\n\t/* OC: Force highest CPU bin */\n\treturn CPU_LEVEL_0;\n\tunsigned int lv = CPU_LEVEL_0;\n\tunsigned int temp = 0;\n\tunsigned int segcode = 0;\n\tunsigned int bincode = 0;\n\tunsigned int turbocode = 0;\n\tunsigned int a_code = 0;"
        
        patched = False
        if old1 in content:
            content = content.replace(old1, new1)
            print("✓ CPU level patch applied")
            patched = True
        else:
            print("✗ CPU level string not found - trying alternative")
            # Try to find the function differently
            if "_mt_cpufreq_get_cpu_level" in content:
                print("  Function exists but format differs, manual check needed")
        
        # Patch 2: Modify OPP table for 2.0GHz if found
        # Look for frequency table definitions
        opp_lines = content.split('\n')
        for i, line in enumerate(opp_lines):
            if 'OPP' in line and 'MHz' in line and ('2000' in line or '2010' in line):
                print(f"  Found possible frequency entry at line {i}: {line.strip()}")
            # Ensure 1.8GHz entry exists for big cluster
            if '1989' in line or '1990' in line or '2000' in line:
                print(f"  Found near-2GHz entry at line {i}: {line.strip()}")
        
        with open(path, "w") as f:
            f.write(content)
        
        if not patched:
            print("\nWARNING: CPU patch didn't match. The function might have different formatting.")
            print("Please verify the file manually after build.")

    - name: Patch GPU Segment - Force 900MHz
      shell: python3 {0}
      run: |
        path = "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c"
        
        with open(path, "r") as f:
            content = f.read()
        
        old = "\tif (g_efuse_speed_bound_id == 0x03000000) {\n\t\t/* 900MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_1;\n\t} else if (g_efuse_speed_bound_id == 0x05000000) {\n\t\t/* 800MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_2;\n\t} else if (g_efuse_speed_bound_id == 0x07000000) {\n\t\t/* 700MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_3;\n\t} else if (g_efuse_speed_bound_id == 0x02000000 && g_efuse_turbo_id == 0x00000008) {\n\t\t/* 900MHz Version */\n\t\tg_segment_id = MT6771_SEGMENT_4;\n\t} else {\n\t\t/* Other Version, set default segment */\n\t\tg_segment_id = MT6771_SEGMENT_2;\n\t}"
        new = "\t/* OC: Force Segment 1 = 900MHz GPU */\n\tg_segment_id = MT6771_SEGMENT_1;"
        
        if old in content:
            content = content.replace(old, new)
            print("✓ GPU segment patch applied (forced 900MHz)")
        else:
            print("✗ GPU patch string NOT found")
            # Try alternative - search for segment detection
            if "g_segment_id = MT6771_SEGMENT" in content:
                print("  Found segment assignment, but format differs")
                # Find the function containing segment logic
                func_start = content.find("g_segment_id = MT6771_SEGMENT")
                if func_start > 0:
                    snippet = content[max(0,func_start-200):func_start+200]
                    print(f"  Context: ...{snippet[:200]}...")
        
        with open(path, "w") as f:
            f.write(content)

    - name: Copy Kernel Config
      run: |
        if [ ! -f kernel_config.txt ]; then
          echo "WARNING: kernel_config.txt not found, creating default"
          # Create a basic defconfig optimized for OC
          cat > kernel_config.txt << 'EOF'
        CONFIG_CPU_FREQ=y
        CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
        CONFIG_CPU_FREQ_GOV_POWERSAVE=y
        CONFIG_CPU_FREQ_GOV_USERSPACE=y
        CONFIG_CPU_FREQ_GOV_ONDEMAND=y
        CONFIG_CPU_FREQ_GOV_INTERACTIVE=y
        CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y
        CONFIG_CPU_FREQ_STAT=y
        CONFIG_MTK_CPU_FREQ=y
        CONFIG_MTK_GPU_FREQ=y
        CONFIG_MTK_GPU_OVERSHOOT=y
        CONFIG_THERMAL=y
        CONFIG_MTK_THERMAL=y
        CONFIG_CPU_THERMAL=y
        EOF
        fi
        
        cp kernel_config.txt kernel-source/arch/arm64/configs/walton_defconfig
        echo "Config copied successfully"

    - name: Configure Kernel
      run: |
        cd kernel-source
        
        # Detect available clang
        CLANG_BIN=$(which clang 2>/dev/null || echo "clang")
        CLANG_VERSION=$($CLANG_BIN --version 2>/dev/null | head -1 || echo "unknown")
        echo "Using compiler: $CLANG_VERSION"
        
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CC=$CLANG_BIN \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             walton_defconfig 2>&1 | tee config.log
        
        # Verify key config options
        echo "Checking OC-related config:"
        grep -E "CPU_FREQ|GPU_FREQ|THERMAL|OVERCLOCK" .config || true

    - name: Build Kernel
      run: |
        cd kernel-source
        
        CLANG_BIN=$(which clang 2>/dev/null || echo "clang")
        
        echo "Starting kernel build..."
        make ARCH=arm64 \
             CROSS_COMPILE=aarch64-linux-gnu- \
             CC=$CLANG_BIN \
             CLANG_TRIPLE=aarch64-linux-gnu- \
             HOSTCFLAGS="-fcommon" \
             KCFLAGS="-Wno-error -fno-integrated-as -Wno-implicit-fallthrough" \
             -j$(nproc) Image.gz 2>&1 | tee build.log
        
        BUILD_RESULT=${PIPESTATUS[0]}
        echo "Build exit code: $BUILD_RESULT"
        
        if [ -f arch/arm64/boot/Image.gz ]; then
          echo ""
          echo "✅ BUILD SUCCESSFUL!"
          ls -lh arch/arm64/boot/Image.gz
          
          # Extract version string
          strings arch/arm64/boot/Image.gz | grep "Linux version" || true
        else
          echo ""
          echo "❌ BUILD FAILED"
          echo ""
          echo "=== ERRORS ==="
          grep -i "error:" build.log | grep -v "warning:" | tail -20
          
          echo ""
          echo "=== LAST 30 LINES ==="
          tail -30 build.log
          exit 1
        fi

    - name: Upload Kernel Image
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: kernel-oc-Image.gz
        path: kernel-source/arch/arm64/boot/Image.gz
        retention-days: 30

    - name: Upload Build Log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-logs
        path: |
          kernel-source/build.log
          kernel-source/config.log
        retention-days: 7

    - name: Upload Patched Source Files
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: patched-source-files
        path: |
          kernel-source/drivers/misc/mediatek/base/power/cpufreq_v1/src/mach/mt6771/mtk_cpufreq_platform.c
          kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.c
        retention-days: 7
