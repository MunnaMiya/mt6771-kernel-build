name: Inspect mt6771 seninf files

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia X5 kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia-x5

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Check ACDK_SENSOR_MCLK_STRUCT definition
      run: |
        echo "=== ACDK_SENSOR_MCLK_STRUCT in Nokia X5 ==="
        grep -rn "ACDK_SENSOR_MCLK_STRUCT" nokia-x5/drivers/misc/mediatek/imgsensor/ --include="*.h" || echo "NOT FOUND"
        echo ""
        echo "=== ACDK_SENSOR_MCLK_STRUCT in Nokia PDA ==="
        grep -rn "ACDK_SENSOR_MCLK_STRUCT" nokia-pda/drivers/misc/mediatek/imgsensor/ --include="*.h" || echo "NOT FOUND"

    - name: Show seninf_clk.h error line (X5)
      run: |
        echo "=== seninf_clk.h line 101 in Nokia X5 ==="
        sed -n '95,105p' nokia-x5/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf_clk.h

    - name: Show seninf_clk.h same lines in PDA
      run: |
        echo "=== seninf_clk.h line 101 in Nokia PDA ==="
        if [ -f "nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf_clk.h" ]; then
          sed -n '95,105p' nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf_clk.h
        else
          echo "File not found in PDA"
        fi

    - name: Show seninf.c lines around 155 (X5)
      run: |
        echo "=== seninf.c lines 150-160 in Nokia X5 ==="
        sed -n '150,160p' nokia-x5/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf.c

    - name: Show seninf.c same lines in PDA
      run: |
        echo "=== seninf.c lines 150-160 in Nokia PDA ==="
        if [ -f "nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf.c" ]; then
          sed -n '150,160p' nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/seninf.c
        else
          echo "File not found in PDA"
        fi

    - name: List mt6771 seninf directory in both kernels
      run: |
        echo "=== Nokia X5 mt6771/seninf ==="
        ls nokia-x5/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/
        echo ""
        echo "=== Nokia PDA mt6771/seninf ==="
        ls nokia-pda/drivers/misc/mediatek/imgsensor/src/mt6771/seninf/ 2>/dev/null || echo "Directory missing in PDA"
