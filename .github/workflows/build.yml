name: Inspect Mali version selection

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Show Mali config from defconfig
      run: |
        cd kernel-source
        echo "=== Mali-related lines in walton_defconfig ==="
        grep -i "mali" arch/arm64/configs/walton_defconfig

    - name: Show GPU Makefile structure
      run: |
        cd kernel-source
        echo "=== GPU Makefile ==="
        cat drivers/misc/mediatek/gpu/Makefile
        echo ""
        echo "=== GPU Mali Makefile ==="
        cat drivers/misc/mediatek/gpu/gpu_mali/Makefile
        echo ""
        echo "=== Mali Bifrost Makefile ==="
        cat drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/Makefile
