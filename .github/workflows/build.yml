name: Inspect PDA kernel imgsensor_sensor.h for SENSOR_FUNCTION_STRUCT inclusion

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Nokia PDA kernel
      run: |
        git clone --depth=1 \
          https://github.com/greenorb007/android_kernel_nokia_PDA.git \
          nokia-pda

    - name: Show top of imgsensor_sensor.h and search for SENSOR_FUNCTION_STRUCT
      run: |
        cd nokia-pda
        FILE="drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_sensor.h"
        echo "=== First 20 lines of $FILE ==="
        head -20 "$FILE"
        echo ""
        echo "=== Lines referencing SENSOR_FUNCTION_STRUCT ==="
        grep -n "SENSOR_FUNCTION_STRUCT" "$FILE"
