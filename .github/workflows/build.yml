name: Inspect MSDK_SCENARIO_ID_ENUM definition

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone main Nokia kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git main-nokia

    - name: Find MSDK_SCENARIO_ID_ENUM definition
      run: |
        cd main-nokia
        echo "=== Where is MSDK_SCENARIO_ID_ENUM defined? ==="
        grep -rn "MSDK_SCENARIO_ID_ENUM" --include="*.h" drivers/misc/mediatek/imgsensor/
