name: Inspect realme s5k3l6 includes

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install git
      run: apt-get update && apt-get install -y git

    - name: Clone Realme kernel
      run: git clone --depth=1 --branch android-13.0 https://github.com/realme-mt6771-devs/android_kernel_realme_mt6771.git realme

    - name: Clone Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Show includes in realme s5k3l6 header (lines 10-40)
      run: |
        FILE="realme/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.h"
        echo "=== Realme s5k3l6 header lines 10-40 ==="
        sed -n '10,40p' "$FILE"

    - name: Show includes in realme s5k3l6 C file (lines 10-40)
      run: |
        FILE="realme/drivers/misc/mediatek/imgsensor/src/common/v1_1/s5k3l6_mipi_raw/s5k3l6mipiraw_Sensor.c"
        echo "=== Realme s5k3l6 C file lines 10-40 ==="
        sed -n '10,40p' "$FILE"

    - name: Show first 5 lines of PDA imgsensor_sensor.h to see its includes
      run: |
        FILE="nokia-pda/drivers/misc/mediatek/imgsensor/src/common/v1_1/imgsensor_sensor.h"
        echo "=== PDA imgsensor_sensor.h first 5 lines ==="
        head -5 "$FILE"

    - name: Check if PDA kd_imgsensor_define.h defines MSDK_SCENARIO_ID_ENUM
      run: |
        echo "=== MSDK_SCENARIO_ID_ENUM in PDA ==="
        grep -n "MSDK_SCENARIO_ID_ENUM" nokia-pda/drivers/misc/mediatek/imgsensor/inc/kd_imgsensor_define.h | head -5
