name: Build MT6771 Kernel
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clone Nokia MT6771 Kernel
      run: |
        git clone --depth=1 \
          https://github.com/nokia-dev/android_kernel_nokia_mt6771.git \
          kernel-source

    - name: Show GPU Header
      continue-on-error: true
      run: |
        cat -n "kernel-source/drivers/misc/mediatek/base/power/mt6771/mtk_gpufreq_core.h"
