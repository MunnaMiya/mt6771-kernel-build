name: Inspect New Nokia 5.1 Plus Kernel (phantomhell) - kernel-4.4

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04

    steps:
    - name: Install dependencies
      run: apt-get update && apt-get install -y git

    - name: Clone new Nokia 5.1 Plus kernel (phantomhell)
      run: git clone --depth=1 https://github.com/phantomhell/device_nokia51plus.git nokia-new

    - name: Clone existing Nokia X5 kernel
      run: git clone --depth=1 https://github.com/nokia-dev/android_kernel_nokia_mt6771.git nokia-x5

    - name: Clone existing Nokia PDA kernel
      run: git clone --depth=1 https://github.com/greenorb007/android_kernel_nokia_PDA.git nokia-pda

    - name: Explore top-level structure
      run: |
        echo "=== Top-level contents of nokia-new ==="
        ls -la nokia-new/

    - name: Verify kernel-4.4 directory exists
      run: |
        if [ -d "nokia-new/kernel-4.4" ]; then
          echo "kernel-4.4 directory found!"
          echo "=== Contents of kernel-4.4/ ==="
          ls -la nokia-new/kernel-4.4/
        else
          echo "ERROR: kernel-4.4 not found"
          exit 1
        fi

    - name: Inspect imgsensor in kernel-4.4
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=============================================="
        echo "=== IMGSENSOR DIRECTORY EXISTS? ==="
        if [ -d "$KERNEL_DIR/drivers/misc/mediatek/imgsensor" ]; then
          echo "YES"
        else
          echo "NO"
          exit 1
        fi

        echo ""
        echo "=============================================="
        echo "=== SENSOR DIRECTORIES IN COMMON/V1_1 ==="
        echo "=============================================="
        ls -1d $KERNEL_DIR/drivers/misc/mediatek/imgsensor/src/common/v1_1/*/ 2>/dev/null || echo "No common/v1_1 directory"

    - name: Check for needed sensors
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=============================================="
        echo "=== NEEDED SENSORS ==="
        echo "=============================================="
        for sensor in s5k3l6_mipi_raw s5k4h7_mipi_raw s5k4h7yx_mipi_raw s5k5e9_mipi_raw s5k5e9yx_mipi_raw; do
          if [ -d "$KERNEL_DIR/drivers/misc/mediatek/imgsensor/src/common/v1_1/$sensor" ]; then
            echo "  FOUND: $sensor"
          else
            echo "  MISSING: $sensor"
          fi
        done

    - name: Compare key headers with PDA
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=============================================="
        echo "=== KEY HEADER SIZES ==="
        echo "=============================================="
        for header in kd_imgsensor_define.h kd_imgsensor.h kd_camera_feature.h kd_camera_feature_enum.h; do
          echo ""
          echo "--- $header ---"
          for src in nokia-x5 nokia-pda new; do
            case $src in
              nokia-x5) FILE="nokia-x5/drivers/misc/mediatek/imgsensor/inc/$header" ;;
              nokia-pda) FILE="nokia-pda/drivers/misc/mediatek/imgsensor/inc/$header" ;;
              new) FILE="$KERNEL_DIR/drivers/misc/mediatek/imgsensor/inc/$header" ;;
            esac
            if [ -f "$FILE" ]; then
              SIZE=$(wc -l < "$FILE")
              echo "  $src: $SIZE lines"
            else
              echo "  $src: MISSING"
            fi
          done
        done

    - name: Check for SENSOR_FUNCTION_STRUCT
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=== SENSOR_FUNCTION_STRUCT in new kernel ==="
        grep -rn "struct SENSOR_FUNCTION_STRUCT {" --include="*.h" $KERNEL_DIR/drivers/misc/mediatek/imgsensor/ 2>/dev/null || echo "NOT FOUND"

    - name: Check for ccu_sensor_info with i2c_id
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=== ccu_sensor_info with i2c_id in new kernel ==="
        grep -rn "i2c_id" --include="*.h" $KERNEL_DIR/drivers/misc/mediatek/ccu/inc/ 2>/dev/null || echo "NOT FOUND"
        echo ""
        echo "=== Full ccu_sensor_info struct ==="
        grep -rn -A5 "struct ccu_sensor_info" --include="*.h" $KERNEL_DIR/drivers/misc/mediatek/ccu/inc/ 2>/dev/null || echo "NOT FOUND"

    - name: Check for missing helper headers
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=== HELPER HEADERS ==="
        for header in imgsensor_ca.h kd_imgsensor_CA_TA_cmd.h; do
          FOUND=$(find $KERNEL_DIR/drivers/misc/mediatek/imgsensor/ -name "$header" | head -n 1)
          if [ -n "$FOUND" ]; then
            echo "  $header: FOUND ($FOUND)"
          else
            echo "  $header: MISSING"
          fi
        done

    - name: Check Mali GPU presence
      run: |
        KERNEL_DIR="nokia-new/kernel-4.4"
        echo "=== MALI BIFROST R14P0 ==="
        if [ -d "$KERNEL_DIR/drivers/misc/mediatek/gpu/gpu_mali/mali_bifrost/mali-r14p0" ]; then
          echo "  FOUND"
        else
          echo "  MISSING"
        fi
